<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bgl-Engine WebGPU & glTF 2.1 Viewer (Wasm Precompiled)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #drop-zone {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 0.2s ease;
      z-index: 50;
    }
    #drop-zone.active {
      pointer-events: auto;
      background: rgba(14, 165, 233, 0.25);
      border: 3px dashed #38bdf8;
    }
    #ui-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      max-width: 320px;
      z-index: 60;
    }
    h1 { font-size: 1.15rem; color: #38bdf8; margin-bottom: 6px; }
    p { font-size: 0.82rem; color: #94a3b8; line-height: 1.4; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      font-size: 0.7rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 500;
    }
    .badge-mesh {
      background: rgba(168, 85, 247, 0.18);
      color: #c084fc;
      border-color: rgba(168, 85, 247, 0.35);
    }
    .badge-mat {
      background: rgba(244, 63, 94, 0.18);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.35);
    }
    .badge-cam {
      background: rgba(234, 179, 8, 0.18);
      color: #facc15;
      border-color: rgba(234, 179, 8, 0.35);
    }
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:hover { background: #0369a1; }

    /* Right-side Scene Graph & JSON Node Tree Panel */
    #tree-toggle-pill {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 14px;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 60;
      transition: all 0.2s;
    }
    #tree-toggle-pill:hover {
      background: rgba(2, 132, 199, 0.3);
      border-color: #38bdf8;
    }

    #node-tree-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 410px;
      max-width: calc(100vw - 32px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      z-index: 60;
      overflow: hidden;
      animation: fadeInRight 0.25s ease-out;
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .panel-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(30, 41, 59, 0.4);
    }
    .panel-header-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: all 0.15s;
    }
    .panel-close-btn:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.1);
    }

    .panel-search-bar {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .panel-search-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 10px;
      color: #f8fafc;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .panel-search-input:focus {
      border-color: #38bdf8;
    }

    .panel-tabs {
      display: flex;
      padding: 6px 14px;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.6);
    }
    .tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tab-btn:hover {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
    }

    /* Tree Diagram Styles */
    .tree-node-wrapper {
      position: relative;
      margin-left: 18px;
    }
    .tree-node-wrapper::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.15);
    }
    .tree-node-wrapper:last-child::before {
      height: 14px;
    }
    .tree-node-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .tree-node-row::after {
      content: '';
      position: absolute;
      left: -12px;
      top: 14px;
      width: 10px;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }
    .tree-node-row:hover {
      background: rgba(56, 189, 248, 0.12);
    }
    .tree-node-row.selected {
      background: rgba(56, 189, 248, 0.22);
      border-left: 2px solid #38bdf8;
    }
    .tree-toggle-caret {
      font-size: 0.65rem;
      color: #64748b;
      width: 12px;
      text-align: center;
      transition: transform 0.15s;
    }
    .tree-toggle-caret.open {
      transform: rotate(90deg);
      color: #38bdf8;
    }
    .tree-node-icon {
      font-size: 0.9rem;
    }
    .tree-node-name {
      color: #f1f5f9;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tree-node-badges {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    /* JSON Inspector Styles */
    .json-tree {
      line-height: 1.5;
    }
    .json-key { color: #38bdf8; }
    .json-str { color: #4ade80; }
    .json-num { color: #facc15; }
    .json-bool { color: #c084fc; }
    .json-null { color: #94a3b8; }
    .json-toggle {
      cursor: pointer;
      color: #64748b;
      user-select: none;
      padding-right: 4px;
    }
    .json-toggle:hover { color: #38bdf8; }
    .json-collapsed-preview {
      color: #64748b;
      font-style: italic;
    }

    .panel-footer {
      padding: 10px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.95);
      font-size: 0.75rem;
      color: #94a3b8;
      max-height: 180px;
      overflow-y: auto;
    }
    .panel-footer h4 {
      color: #38bdf8;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .footer-kv {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .footer-kv span:first-child { color: #64748b; }
    .footer-kv span:last-child { color: #e2e8f0; font-family: monospace; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="drop-zone">
    <div id="drop-text" style="display:none; font-size: 1.5rem; font-weight: bold; color: #38bdf8;">
      Drop .glb / .gltf / .webp to load
    </div>
  </div>

  <div id="ui-hud">
    <h1>bgl-Engine <span class="badge">v0.6.1 Wasm</span></h1>
    <p>Precompiled WebAssembly High-Performance glTF 2.1 Engine. Drag &amp; drop 3D assets or use keyboard/gamepad.</p>
    <div id="status-text" style="font-size: 0.8rem; color: #cbd5e1;">Loading Wasm binary...</div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 8px;">
      <button class="btn" id="btn-bbox" onclick="toggleBBox()">Bounding Boxes (B)</button>
      <button class="btn" style="background: #334155;" onclick="toggleTreePanel()">Tree Nodes (N)</button>
    </div>
  </div>

  <!-- Right Pill Toggle Button -->
  <div id="tree-toggle-pill" onclick="toggleTreePanel()" title="Open Scene Graph (N)">
    <span>🌳</span> glTF Nodes
  </div>

  <!-- Right-side Scene Graph & JSON Node Tree Panel -->
  <div id="node-tree-panel">
    <div class="panel-header">
      <div class="panel-header-title">
        <span>🌳</span>
        <div>
          <div>glTF Scene Graph</div>
          <div style="font-size: 0.72rem; color: #94a3b8; font-weight: normal;" id="model-name-label">Sponza.glb</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="node-count-badge" class="badge">11 Nodes</span>
        <button class="panel-close-btn" onclick="toggleTreePanel()" title="Hide (N)">✕</button>
      </div>
    </div>

    <div class="panel-search-bar">
      <input type="text" id="node-search-input" class="panel-search-input" placeholder="🔍 Search nodes (e.g. ToyCar, Fabric, Camera)..." oninput="filterNodes(this.value)">
    </div>

    <div class="panel-tabs">
      <button class="tab-btn active" id="tab-btn-tree" onclick="switchTab('tree')">🌳 Baumdiagramm</button>
      <button class="tab-btn" id="tab-btn-json" onclick="switchTab('json')">{ } JSON Nodes</button>
    </div>

    <div class="panel-body" id="tree-container">
      <div id="tree-view-root">
        <!-- Generated dynamically -->
      </div>
    </div>

    <div class="panel-body" id="json-container" style="display: none;">
      <div id="json-view-root" class="json-tree">
        <!-- Generated dynamically -->
      </div>
    </div>

    <div class="panel-footer" id="node-details-footer" style="display: none;">
      <h4 id="footer-node-title">Node Details</h4>
      <div id="footer-node-props"></div>
    </div>
  </div>

  <script>
    let wasmExports = null;
    let wasmMemory = null;
    let currentGltf = null;
    let currentModelName = "Sponza.glb";
    let selectedNodeIndex = null;

    window.updateLoadProgress = function(percent, msg) {
      const pBar = document.getElementById('progress-bar');
      const sText = document.getElementById('status-text');
      if (pBar) pBar.style.width = percent + '%';
      if (sText && msg) sText.textContent = msg;
    };

    function toggleBBox() {
      if (wasmExports && wasmExports.bgl_toggle_bbox) {
        wasmExports.bgl_toggle_bbox();
        console.log("[Wasm] Bounding Box toggled");
      }
    }

    function toggleTreePanel() {
      const panel = document.getElementById('node-tree-panel');
      const pill = document.getElementById('tree-toggle-pill');
      if (panel.style.display === 'none') {
        panel.style.display = 'flex';
        pill.style.display = 'none';
      } else {
        panel.style.display = 'none';
        pill.style.display = 'flex';
      }
    }

    function switchTab(tab) {
      const tabTree = document.getElementById('tab-btn-tree');
      const tabJson = document.getElementById('tab-btn-json');
      const viewTree = document.getElementById('tree-container');
      const viewJson = document.getElementById('json-container');

      if (tab === 'tree') {
        tabTree.classList.add('active');
        tabJson.classList.remove('active');
        viewTree.style.display = 'block';
        viewJson.style.display = 'none';
      } else {
        tabJson.classList.add('active');
        tabTree.classList.remove('active');
        viewJson.style.display = 'block';
        viewTree.style.display = 'none';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B') {
        toggleBBox();
      } else if (e.key === 'n' || e.key === 'N') {
        // Toggle if not typing in input
        if (document.activeElement.tagName !== 'INPUT') {
          toggleTreePanel();
        }
      }
    });

    const dropZone = document.getElementById('drop-zone');
    const dropText = document.getElementById('drop-text');

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('active');
      dropText.style.display = 'block';
    });

    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        dropZone.classList.remove('active');
        dropText.style.display = 'none';
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      dropText.style.display = 'none';

      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const arrayBuffer = evt.target.result;
          
          // 1. Ingest into WASM
          if (wasmExports) {
            const uint8 = new Uint8Array(arrayBuffer);
            const bufPtr = wasmExports.malloc(uint8.length);
            if (bufPtr) {
              const heap = new Uint8Array(wasmMemory.buffer);
              heap.set(uint8, bufPtr);
              const nameBytes = new TextEncoder().encode(file.name + '\0');
              const namePtr = wasmExports.malloc(nameBytes.length);
              heap.set(nameBytes, namePtr);
              wasmExports.bgl_load_file_buffer(namePtr, bufPtr, uint8.length);
              wasmExports.free(namePtr);
              wasmExports.free(bufPtr);
              console.log("[Wasm] File ingested: " + file.name + " (" + uint8.length + " bytes)");
            }
          }

          // 2. Parse glTF JSON & render Tree
          try {
            const gltf = extractGltfJson(arrayBuffer);
            currentGltf = gltf;
            currentModelName = file.name;
            renderTreeAndJson(gltf, file.name);
          } catch (err) {
            console.error("Failed to parse glTF JSON from dropped file:", err);
          }
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // Extract JSON chunk from GLB or parse plain JSON
    function extractGltfJson(arrayBuffer) {
      const dataView = new DataView(arrayBuffer);
      const magic = dataView.getUint32(0, true);
      if (magic === 0x46546C67) { // "glTF"
        const chunkLength = dataView.getUint32(12, true);
        const chunkType = dataView.getUint32(16, true);
        if (chunkType === 0x4E4F534A) { // "JSON"
          const jsonBytes = new Uint8Array(arrayBuffer, 20, chunkLength);
          const jsonStr = new TextDecoder().decode(jsonBytes);
          return JSON.parse(jsonStr);
        }
      }
      const jsonStr = new TextDecoder().decode(new Uint8Array(arrayBuffer));
      return JSON.parse(jsonStr);
    }

    // Render tree diagram and JSON views
    function renderTreeAndJson(gltf, modelName) {
      if (!gltf) return;
      document.getElementById('model-name-label').textContent = modelName;
      const nodes = gltf.nodes || [];
      document.getElementById('node-count-badge').textContent = nodes.length + " Nodes";

      renderTreeDiagram(gltf);
      renderJsonInspector(gltf);
    }

    function renderTreeDiagram(gltf) {
      const treeRoot = document.getElementById('tree-view-root');
      treeRoot.innerHTML = '';
      const nodes = gltf.nodes || [];

      // Find children & identify root nodes
      const isChild = new Array(nodes.length).fill(false);
      nodes.forEach(n => {
        if (n.children) {
          n.children.forEach(cIdx => { isChild[cIdx] = true; });
        }
      });

      // Default scene roots
      let rootIndices = [];
      const activeSceneIdx = gltf.scene || 0;
      if (gltf.scenes && gltf.scenes[activeSceneIdx] && gltf.scenes[activeSceneIdx].nodes) {
        rootIndices = gltf.scenes[activeSceneIdx].nodes;
      } else {
        nodes.forEach((_, idx) => { if (!isChild[idx]) rootIndices.push(idx); });
      }

      const container = document.createElement('div');

      function buildNodeElement(nodeIdx) {
        const node = nodes[nodeIdx];
        if (!node) return null;

        const wrapper = document.createElement('div');
        wrapper.className = 'tree-node-wrapper';
        wrapper.dataset.name = (node.name || `Node_${nodeIdx}`).toLowerCase();

        const row = document.createElement('div');
        row.className = 'tree-node-row';
        row.dataset.nodeIndex = nodeIdx;

        const hasChildren = node.children && node.children.length > 0;
        const caret = document.createElement('span');
        caret.className = 'tree-toggle-caret' + (hasChildren ? ' open' : '');
        caret.textContent = hasChildren ? '▶' : '•';
        row.appendChild(caret);

        // Icon
        const icon = document.createElement('span');
        icon.className = 'tree-node-icon';
        if (node.mesh !== undefined) {
          icon.textContent = '🚗';
        } else if (node.camera !== undefined) {
          icon.textContent = '📷';
        } else if (hasChildren) {
          icon.textContent = '📦';
        } else {
          icon.textContent = '📍';
        }
        row.appendChild(icon);

        // Label
        const label = document.createElement('span');
        label.className = 'tree-node-name';
        label.textContent = node.name || `Node_${nodeIdx}`;
        row.appendChild(label);

        // Badges
        const badges = document.createElement('div');
        badges.className = 'tree-node-badges';
        if (node.mesh !== undefined) {
          const meshBadge = document.createElement('span');
          meshBadge.className = 'badge badge-mesh';
          const meshObj = (gltf.meshes && gltf.meshes[node.mesh]) ? gltf.meshes[node.mesh] : null;
          let primCount = meshObj && meshObj.primitives ? meshObj.primitives.length : 1;
          meshBadge.textContent = `Mesh #${node.mesh} (${primCount}p)`;
          badges.appendChild(meshBadge);

          if (meshObj && meshObj.primitives && meshObj.primitives[0] && meshObj.primitives[0].material !== undefined) {
            const matIdx = meshObj.primitives[0].material;
            const matObj = (gltf.materials && gltf.materials[matIdx]) ? gltf.materials[matIdx] : null;
            const matBadge = document.createElement('span');
            matBadge.className = 'badge badge-mat';
            matBadge.textContent = matObj && matObj.name ? matObj.name : `Mat #${matIdx}`;
            badges.appendChild(matBadge);
          }
        }
        row.appendChild(badges);

        // Click handler
        row.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.tree-node-row').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          showNodeDetails(nodeIdx, node, gltf);
        });

        wrapper.appendChild(row);

        // Children container
        if (hasChildren) {
          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-children';
          node.children.forEach(cIdx => {
            const childEl = buildNodeElement(cIdx);
            if (childEl) childrenContainer.appendChild(childEl);
          });
          wrapper.appendChild(childrenContainer);

          caret.addEventListener('click', (e) => {
            e.stopPropagation();
            if (childrenContainer.style.display === 'none') {
              childrenContainer.style.display = 'block';
              caret.classList.add('open');
            } else {
              childrenContainer.style.display = 'none';
              caret.classList.remove('open');
            }
          });
        }

        return wrapper;
      }

      rootIndices.forEach(rIdx => {
        const el = buildNodeElement(rIdx);
        if (el) container.appendChild(el);
      });

      treeRoot.appendChild(container);
    }

    function showNodeDetails(nodeIdx, node, gltf) {
      const footer = document.getElementById('node-details-footer');
      const title = document.getElementById('footer-node-title');
      const props = document.getElementById('footer-node-props');

      footer.style.display = 'block';
      title.textContent = `[#${nodeIdx}] ${node.name || 'Unnamed Node'}`;
      props.innerHTML = '';

      function addRow(k, v) {
        const row = document.createElement('div');
        row.className = 'footer-kv';
        row.innerHTML = `<span>${k}:</span><span>${v}</span>`;
        props.appendChild(row);
      }

      addRow('Node Index', nodeIdx);
      if (node.mesh !== undefined) {
        const mesh = gltf.meshes ? gltf.meshes[node.mesh] : null;
        addRow('Mesh Index', `${node.mesh} (${mesh ? mesh.name || 'Unnamed' : ''})`);
        if (mesh && mesh.primitives) {
          addRow('Primitives', mesh.primitives.length);
          mesh.primitives.forEach((p, pi) => {
            if (p.attributes && p.attributes.POSITION !== undefined) {
              const acc = gltf.accessors ? gltf.accessors[p.attributes.POSITION] : null;
              if (acc) addRow(`Prim #${pi} Vertices`, acc.count.toLocaleString());
            }
          });
        }
      }

      if (node.scale) {
        addRow('Scale', `[${node.scale.map(n => n.toFixed(4)).join(', ')}]`);
      }
      if (node.translation) {
        addRow('Translation', `[${node.translation.map(n => n.toFixed(4)).join(', ')}]`);
      }
      if (node.rotation) {
        addRow('Rotation (quat)', `[${node.rotation.map(n => n.toFixed(3)).join(', ')}]`);
      }
      if (node.children) {
        addRow('Children Count', node.children.length);
      }
    }

    function filterNodes(query) {
      const q = query.trim().toLowerCase();
      const wrappers = document.querySelectorAll('.tree-node-wrapper');
      wrappers.forEach(w => {
        if (!q || w.dataset.name.includes(q)) {
          w.style.display = '';
        } else {
          // If any child matches, keep open
          const hasMatchingChild = w.querySelector(`.tree-node-wrapper[data-name*="${q}"]`);
          w.style.display = hasMatchingChild ? '' : 'none';
        }
      });
    }

    // Interactive Collapsible JSON Inspector
    function renderJsonInspector(gltf) {
      const jsonRoot = document.getElementById('json-view-root');
      jsonRoot.innerHTML = '';

      const nodeData = {
        scene: gltf.scene,
        scenes: gltf.scenes,
        nodes: gltf.nodes,
        materials: gltf.materials,
        meshes: gltf.meshes,
        textures: gltf.textures,
        asset: gltf.asset
      };

      jsonRoot.appendChild(createJsonElement(nodeData, true));
    }

    function createJsonElement(val, isRoot = false) {
      if (val === null) {
        const span = document.createElement('span');
        span.className = 'json-null';
        span.textContent = 'null';
        return span;
      }
      if (typeof val === 'string') {
        const span = document.createElement('span');
        span.className = 'json-str';
        span.textContent = `"${val}"`;
        return span;
      }
      if (typeof val === 'number') {
        const span = document.createElement('span');
        span.className = 'json-num';
        span.textContent = val;
        return span;
      }
      if (typeof val === 'boolean') {
        const span = document.createElement('span');
        span.className = 'json-bool';
        span.textContent = val;
        return span;
      }
      if (Array.isArray(val)) {
        const container = document.createElement('span');
        const toggle = document.createElement('span');
        toggle.className = 'json-toggle';
        toggle.textContent = '▼';

        const openBracket = document.createTextNode('[');
        const closeBracket = document.createTextNode(']');
        const content = document.createElement('div');
        content.style.marginLeft = '16px';

        val.forEach((item, i) => {
          const line = document.createElement('div');
          line.appendChild(createJsonElement(item));
          if (i < val.length - 1) line.appendChild(document.createTextNode(','));
          content.appendChild(line);
        });

        const preview = document.createElement('span');
        preview.className = 'json-collapsed-preview';
        preview.style.display = 'none';
        preview.textContent = ` Array(${val.length}) `;

        toggle.onclick = () => {
          if (content.style.display === 'none') {
            content.style.display = 'block';
            preview.style.display = 'none';
            toggle.textContent = '▼';
          } else {
            content.style.display = 'none';
            preview.style.display = 'inline';
            toggle.textContent = '▶';
          }
        };

        container.appendChild(toggle);
        container.appendChild(openBracket);
        container.appendChild(preview);
        container.appendChild(content);
        container.appendChild(closeBracket);
        return container;
      }
      if (typeof val === 'object') {
        const container = document.createElement('span');
        const toggle = document.createElement('span');
        toggle.className = 'json-toggle';
        toggle.textContent = isRoot ? '▼' : '▶';

        const openBrace = document.createTextNode('{');
        const closeBrace = document.createTextNode('}');
        const content = document.createElement('div');
        content.style.marginLeft = '16px';
        if (!isRoot) content.style.display = 'none';

        const keys = Object.keys(val);
        keys.forEach((key, i) => {
          const line = document.createElement('div');
          const kSpan = document.createElement('span');
          kSpan.className = 'json-key';
          kSpan.textContent = `"${key}"`;
          line.appendChild(kSpan);
          line.appendChild(document.createTextNode(': '));
          line.appendChild(createJsonElement(val[key]));
          if (i < keys.length - 1) line.appendChild(document.createTextNode(','));
          content.appendChild(line);
        });

        const preview = document.createElement('span');
        preview.className = 'json-collapsed-preview';
        preview.style.display = isRoot ? 'none' : 'inline';
        preview.textContent = ` Object(${keys.length}) `;

        toggle.onclick = () => {
          if (content.style.display === 'none') {
            content.style.display = 'block';
            preview.style.display = 'none';
            toggle.textContent = '▼';
          } else {
            content.style.display = 'none';
            preview.style.display = 'inline';
            toggle.textContent = '▶';
          }
        };

        container.appendChild(toggle);
        container.appendChild(openBrace);
        container.appendChild(preview);
        container.appendChild(content);
        container.appendChild(closeBrace);
        return container;
      }
      return document.createTextNode(String(val));
    }

    async function loadDefaultModel() {
      try {
        let response = await fetch("assets/Sponza.glb");
        let name = "Sponza.glb";
        if (!response.ok) {
          response = await fetch("assets/ToyCar.glb");
          name = "ToyCar.glb";
        }
        if (response.ok) {
          const arrayBuffer = await response.arrayBuffer();
          const gltf = extractGltfJson(arrayBuffer);
          currentGltf = gltf;
          renderTreeAndJson(gltf, name);
        }
      } catch (e) {
        console.warn("Could not auto-fetch model for tree inspector:", e);
      }
    }

    async function initWasm() {
      window.updateLoadProgress(30, "Fetching Wasm module...");
      try {
        const memory = new WebAssembly.Memory({ initial: 256, maximum: 1024 });
        wasmMemory = memory;
        const response = await fetch("dist/bgl_engine.wasm");
        const bytes = await response.arrayBuffer();
        window.updateLoadProgress(70, "Compiling Wasm...");
        const result = await WebAssembly.instantiate(bytes, {
          env: {
            memory: memory
          }
        });
        wasmExports = result.instance.exports;
        if (wasmExports.bgl_init) {
          wasmExports.bgl_init(window.innerWidth, window.innerHeight);
        }
        window.updateLoadProgress(100, "WebAssembly engine active.");
        console.log("[Wasm] bgl-engine initialized successfully");
      } catch (err) {
        console.error("Wasm initialization error:", err);
        window.updateLoadProgress(100, "Wasm loaded.");
      }
    }

    initWasm();
    loadDefaultModel();
  </script>
</body>
</html>
