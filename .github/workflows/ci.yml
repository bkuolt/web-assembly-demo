name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-validation:
    name: Web App Syntax & Assets Validation
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate Client JavaScript
      run: |
        node --check web/app.js

  native-linux:
    name: Linux amd64 (C++23, WebGPU, Conan 2)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          pkg-config \
          libsdl2-dev \
          libcurl4-openssl-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libvulkan-dev \
          vulkan-tools \
          xvfb

    - name: Install Conan 2.x
      run: |
        pip install "conan>=2.0"
        conan --version

    - name: Cache Conan Packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-

    - name: Install Dependencies via Conan
      run: |
        conan profile detect --force
        conan install . -s build_type=Release --build=missing --lockfile=conan.lock

    - name: Configure CMake
      run: |
        cmake -B build/Release -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
          -DBGL_BUILD_TESTING=ON

    - name: Build Libraries and Viewer Executable
      run: |
        cmake --build build/Release -j$(nproc)

    - name: Execute GTest Unit Test Suites
      run: |
        xvfb-run ctest --test-dir build/Release --output-on-failure

    - name: Run Smoke Test on bgl_viewer
      run: |
        xvfb-run timeout 15s ./build/Release/bgl_viewer --headless

    - name: Package Native Binaries
      run: |
        mkdir -p dist-native/assets/fonts
        cp -f build/Release/bgl_viewer dist-native/
        cp -f build/Release/bgl_unit_tests dist-native/
        cp -f build/Release/libbgl_*.so dist-native/
        cp -f third_party/wgpu-native/lib/libwgpu_native.so dist-native/
        if [ -d assets/fonts ]; then cp -rf assets/fonts/* dist-native/assets/fonts/; fi
        cp -f README.md CHANGELOG.md dist-native/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bgl_viewer-linux-amd64
        path: dist-native/

  deploy-pages:
    name: Deploy GitHub Pages Web App
    needs: [web-validation, native-linux]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Stage GitHub Pages Site
      run: |
        mkdir -p _site/dist _site/assets _site/web/dist _site/web/assets
        # 1. Root level assets for direct domain access (https://<user>.github.io/<repo>/)
        cp -f web/index.html _site/index.html
        cp -f web/style.css _site/style.css
        cp -f web/app.js _site/app.js
        cp -f web/dist/* _site/dist/
        cp -f web/assets/* _site/assets/
        # 2. Subdirectory assets for subpath access (https://<user>.github.io/<repo>/web/index.html)
        cp -f web/index.html _site/web/index.html
        cp -f web/style.css _site/web/style.css
        cp -f web/app.js _site/web/app.js
        cp -f web/dist/* _site/web/dist/
        cp -f web/assets/* _site/web/assets/
        # 3. Add .nojekyll to prevent Jekyll from skipping underscore files or assets
        touch _site/.nojekyll

    - name: Deploy to gh-pages Branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        keep_files: false
        force_orphan: true

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages Action Environment
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

  release:
    name: Publish Release Artifacts
    needs: native-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: bgl_viewer-linux-amd64
        path: dist-native/

    - name: Create Release Tarballs
      run: |
        tar -czvf bgl_viewer-linux-amd64.tar.gz -C dist-native .
        python3 scripts/package_web.py --output dist/bgl_web_app_minimal.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bgl_viewer-linux-amd64.tar.gz
          dist/bgl_web_app_minimal.zip
        generate_release_notes: true
