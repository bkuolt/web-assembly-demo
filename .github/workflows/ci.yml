name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*', '*.*.*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  web-validation:
    name: Web App Syntax & Assets Validation
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate Client JavaScript & Web Suites
      run: |
        node --check web/js/core.js
        node --check web/js/gltf.js
        node --check web/js/renderer.js
        node --check web/app.js
        node --check web/gltf_worker.js
        node tests/test_web_unit.js
        node tests/test_webgpu_path.js

  code-quality:
    name: Code Formatting & Clang-Tidy Quality
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Clang Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy clang

    - name: Check Clang-Format Compliance
      run: |
        find src apps tests \( -name "*.cpp" -o -name "*.hpp" \) -print0 | xargs -0 clang-format --dry-run -Werror

    - name: Run Clang-Tidy Static Analysis (WASM Bridge)
      run: |
        clang-tidy --config-file=.clang-tidy src/wasm/wasm_bridge.cpp -- -std=c++23 -Wall -Wextra -Isrc

  wasm-emscripten:
    name: Emscripten WebAssembly Build (WASM & JS)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.56'

    - name: Build & Verify Standalone WASM Binary
      run: |
        em++ --version
        mkdir -p web/dist
        em++ -O3 -std=c++23 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -ffreestanding -c src/wasm/wasm_bridge.cpp -o /tmp/wasm_bridge.o
        wasm-ld --no-entry --strip-debug --import-memory --initial-memory=16777216 --max-memory=67108864 -z stack-size=65536 \
          --export=malloc --export=free \
          --export=bgl_init --export=bgl_resize --export=bgl_load_file_buffer \
          --export=bgl_select_node --export=bgl_clear_selection --export=bgl_pick_node \
          --export=bgl_get_camera_count --export=bgl_select_camera \
          --export=bgl_set_animation --export=bgl_set_animation_playing \
          --export=bgl_toggle_bbox --export=bgl_toggle_quadtree --export=bgl_toggle_skybox \
          --export=bgl_toggle_debug_overlay --export=bgl_toggle_bump --export=bgl_toggle_mipmaps \
          --export=bgl_toggle_shadows --export=bgl_toggle_reflections --export=bgl_toggle_ao \
          --export=bgl_toggle_pom --export=bgl_toggle_lens_flare --export=bgl_toggle_ssao \
          --export=bgl_toggle_bloom --export=bgl_toggle_occlusion --export=bgl_toggle_camera_mode \
          --export=bgl_toggle_turntable --export=bgl_toggle_day_night_cycle \
          --export=bgl_toggle_lod --export=bgl_toggle_auto_lod \
          --export=bgl_set_ssao_intensity --export=bgl_set_bloom_intensity --export=bgl_set_ao_intensity \
          --export=bgl_set_bump_scale --export=bgl_set_parallax_scale --export=bgl_set_lens_flare_intensity \
          --export=bgl_set_weather_mode --export=bgl_set_weather_intensity --export=bgl_set_wind_strength \
          --export=bgl_set_turntable_speed --export=bgl_set_time_of_day --export=bgl_set_day_night_speed \
          --export=bgl_set_lod_bias --export=bgl_set_debug_view \
          --export=bgl_camera_focus_selection --export=bgl_camera_frame_all \
          --export=bgl_camera_save_bookmark --export=bgl_camera_restore_bookmark \
          --export=bgl_camera_move --export=bgl_camera_zoom --export=bgl_camera_orbit --export=bgl_camera_pan \
          --export=bgl_gamepad_state \
          /tmp/wasm_bridge.o -o web/dist/bgl_engine.wasm
        node -e "const fs = require('fs'); const m = new WebAssembly.Module(fs.readFileSync('web/dist/bgl_engine.wasm')); const imp = WebAssembly.Module.imports(m); if (imp.length !== 1 || imp[0].module !== 'env' || imp[0].name !== 'memory') throw new Error('Unexpected WASM imports');"

    - name: Package Minimal Web App
      run: |
        mkdir -p dist
        python3 scripts/package_web.py --output dist/bgl_web_app_minimal.zip

    - name: Upload WebAssembly Distribution Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bgl_web_app-wasm
        path: |
          dist/bgl_web_app_minimal.zip
          web/

  native-linux:
    name: Linux amd64 (C++23, WebGPU, Conan 2)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          pkg-config \
          clang-tidy \
          libsdl2-dev \
          libcurl4-openssl-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libvulkan-dev \
          vulkan-tools \
          xvfb

    - name: Install Conan 2.x
      run: |
        pip install "conan>=2.0"
        conan --version

    - name: Cache Conan Packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py') }}
        restore-keys: |
          conan-${{ runner.os }}-

    - name: Install Dependencies via Conan
      run: |
        conan profile detect --force
        conan install . -s build_type=Release --build=missing --lockfile=conan.lock

    - name: Configure CMake
      run: |
        cmake -B build/Release -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
          -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
          -DBGL_BUILD_TESTING=ON

    - name: Run Clang-Tidy Static Analysis (Core & GPU Passes)
      run: |
        clang-tidy -p build/Release --config-file=.clang-tidy \
          src/core/Camera.cpp src/core/MemoryPool.cpp src/gpu/ShadowPass.cpp

    - name: Build Libraries and Viewer Executable
      run: |
        cmake --build build/Release -j$(nproc)

    - name: Execute GTest & Node Unit Test Suites
      run: |
        xvfb-run ctest --test-dir build/Release --output-on-failure -E BrowserE2ETest

    - name: Run Smoke Test on bgl_viewer
      run: |
        xvfb-run timeout 15s ./build/Release/bgl_viewer --headless assets/ToyCar.glb

    - name: Package Native Binaries
      run: |
        mkdir -p dist-native/assets/fonts
        cp -f build/Release/bgl_viewer dist-native/
        cp -f build/Release/bgl_unit_tests dist-native/
        cp -f build/Release/libbgl_*.so dist-native/
        cp -f third_party/wgpu-native/lib/libwgpu_native.so dist-native/
        if [ -d assets/fonts ]; then cp -rf assets/fonts/* dist-native/assets/fonts/; fi
        cp -f README.md CHANGELOG.md dist-native/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bgl_viewer-linux-amd64
        path: dist-native/

  doxygen-docs:
    name: Build Doxygen API Documentation
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Doxygen & Graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz python3

    - name: Generate Doxygen HTML Documentation
      run: |
        doxygen --version
        mkdir -p build/docs
        doxygen Doxyfile

    - name: Upload Doxygen HTML Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bgl_doxygen-docs
        path: build/docs/html/

  deploy-pages:
    name: Deploy GitHub Pages Web App & Doxygen Docs
    needs: [web-validation, wasm-emscripten, native-linux, doxygen-docs]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download WASM Artifacts
      uses: actions/download-artifact@v4
      with:
        name: bgl_web_app-wasm
        path: _wasm_artifact/

    - name: Download Doxygen Documentation Artifact
      uses: actions/download-artifact@v4
      with:
        name: bgl_doxygen-docs
        path: _doxygen_html/

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Stage GitHub Pages Site
      run: |
        mkdir -p _site/dist _site/assets _site/js _site/docs _site/web/dist _site/web/assets _site/web/js _site/web/docs web/dist
        if [ -d _wasm_artifact/web/dist ] && [ "$(ls -A _wasm_artifact/web/dist 2>/dev/null)" ]; then
          cp -rf _wasm_artifact/web/dist/* web/dist/
        fi
        # 1. Root level assets for direct domain access (https://<user>.github.io/<repo>/)
        cp -f web/index.html _site/index.html
        cp -f web/style.css _site/style.css
        cp -f web/app.js _site/app.js
        cp -f web/gltf_worker.js _site/gltf_worker.js
        cp -rf web/js/* _site/js/
        if [ -d web/dist ] && [ "$(ls -A web/dist 2>/dev/null)" ]; then cp -rf web/dist/* _site/dist/; fi
        cp -rf web/assets/* _site/assets/
        if [ -d _doxygen_html ] && [ "$(ls -A _doxygen_html 2>/dev/null)" ]; then cp -rf _doxygen_html/* _site/docs/; fi
        # 2. Subdirectory assets for subpath access (https://<user>.github.io/<repo>/web/index.html)
        cp -f web/index.html _site/web/index.html
        cp -f web/style.css _site/web/style.css
        cp -f web/app.js _site/web/app.js
        cp -f web/gltf_worker.js _site/web/gltf_worker.js
        cp -rf web/js/* _site/web/js/
        if [ -d web/dist ] && [ "$(ls -A web/dist 2>/dev/null)" ]; then cp -rf web/dist/* _site/web/dist/; fi
        cp -rf web/assets/* _site/web/assets/
        if [ -d _doxygen_html ] && [ "$(ls -A _doxygen_html 2>/dev/null)" ]; then cp -rf _doxygen_html/* _site/web/docs/; fi
        # 3. Add .nojekyll to prevent Jekyll from skipping underscore files or assets
        touch _site/.nojekyll

    - name: Deploy to gh-pages Branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_site
        keep_files: false
        force_orphan: true

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages Action Environment
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

  release:
    name: Publish Release Artifacts
    needs: [native-linux, wasm-emscripten]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: bgl_viewer-linux-amd64
        path: dist-native/

    - name: Download WASM Artifacts
      uses: actions/download-artifact@v4
      with:
        name: bgl_web_app-wasm
        path: dist-wasm/

    - name: Create Release Tarballs
      run: |
        tar -czvf bgl_viewer-linux-amd64.tar.gz -C dist-native .
        mkdir -p dist
        if [ -f dist-wasm/dist/bgl_web_app_minimal.zip ]; then
          cp -f dist-wasm/dist/bgl_web_app_minimal.zip dist/bgl_web_app_minimal.zip
        else
          if [ -d dist-wasm/web/dist ] && [ "$(ls -A dist-wasm/web/dist 2>/dev/null)" ]; then
            mkdir -p web/dist
            cp -rf dist-wasm/web/dist/* web/dist/
          fi
          python3 scripts/package_web.py --output dist/bgl_web_app_minimal.zip
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bgl_viewer-linux-amd64.tar.gz
          dist/bgl_web_app_minimal.zip
        generate_release_notes: true
