version: '3'

vars:
  BUILD_DIR: build/Release
  CLANG_BUILD_DIR: build/review-clang
  WEB_PORT: 8080

tasks:
  setup:
    desc: Install all dependencies via Conan 2.x lockfile from ConanCenter
    cmds:
      - conan install . -s build_type=Release --build=missing --lockfile=conan.lock

  configure:
    desc: Configure CMake using Conan toolchain
    deps: [setup]
    cmds:
      - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE={{.BUILD_DIR}}/generators/conan_toolchain.cmake -DBGL_BUILD_TESTING=ON

  build:
    desc: Build all native shared libraries, engine samples, viewer, and test executables
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j$(nproc)
      - mkdir -p build-native
      - cp -f {{.BUILD_DIR}}/bgl_viewer build-native/ 2>/dev/null || true
      - cp -f {{.BUILD_DIR}}/bgl_unit_tests build-native/ 2>/dev/null || true
      - cp -f {{.BUILD_DIR}}/sample_* build-native/ 2>/dev/null || true
      - cp -f {{.BUILD_DIR}}/libbgl_*.so build-native/ 2>/dev/null || true
      - cp -f third_party/wgpu-native/lib/libwgpu_native.so build-native/ 2>/dev/null || true

  test:
    desc: Run C++ GTest and Node.js WebGPU/unit test suites
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure -E BrowserE2ETest

  test-web:
    desc: Run browser WebGPU JavaScript syntax, unit, and pipeline suites
    cmds:
      - node --check web/js/core.js
      - node --check web/js/gltf.js
      - node --check web/js/math.js
      - node --check web/js/shaders.js
      - node --check web/js/renderer.js
      - node --check web/app.js
      - node --check web/gltf_worker.js
      - node tests/test_web_unit.js
      - node tests/test_webgpu_path.js

  format:
    desc: Verify C++23 clang-format compliance across src/, apps/, include/, samples/, and tests/
    cmds:
      - find src apps include samples tests \( -name "*.cpp" -o -name "*.hpp" \) -print0 | xargs -0 clang-format --dry-run -Werror

  lint:
    desc: Run clang-tidy static analysis on WASM bridge and Clang compile database
    cmds:
      - clang-tidy --config-file=.clang-tidy src/wasm/wasm_bridge.cpp -- -std=c++23 -Wall -Wextra -Isrc
      - cmake --preset clang
      - run-clang-tidy -p {{.CLANG_BUILD_DIR}} -config-file=.clang-tidy '(src/(audio|core|engine|gpu|scene|text|ui)|apps/viewer|samples/.*)/.*\.cpp$'

  package-web:
    desc: Build minimal web distribution archive into dist/bgl_web_app_minimal.zip
    cmds:
      - python3 scripts/package_web.py

  docs:
    desc: Generate Doxygen + Graphviz HTML API documentation into build/docs/html/
    cmds:
      - mkdir -p build/docs
      - doxygen Doxyfile
      - echo "Doxygen HTML documentation generated at build/docs/html/index.html"

  ci:
    desc: Run complete CI pipeline locally
    cmds:
      - bash scripts/run_ci_locally.sh

  run-native:
    desc: Run native WebGPU desktop viewer (bgl_viewer)
    deps: [build]
    cmds:
      - ./build-native/bgl_viewer

  run-web:
    desc: Start local HTTP web server for the WebAssembly WebGPU viewer
    cmds:
      - echo "Serving bgl-engine WebAssembly viewer at http://localhost:{{.WEB_PORT}}"
      - echo "Press Ctrl+C to stop the server."
      - python3 -m http.server {{.WEB_PORT}} --directory web

  clean:
    desc: Clean build directories and temporary distribution artifacts
    cmds:
      - rm -rf build build-native dist-native dist CMakeUserPresets.json
