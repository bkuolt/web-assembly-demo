version: '3'

vars:
  BUILD_DIR: build/Release
  CONAN_HOME_DIR: /tmp/conan_bgl

tasks:
  setup:
    desc: Install all dependencies via Conan 2.x from ConanCenter
    cmds:
      - mkdir -p {{.CONAN_HOME_DIR}}
      - CONAN_HOME={{.CONAN_HOME_DIR}} conan install . -pr:b=profiles/linux_amd64 -pr:h=profiles/linux_amd64 -b=missing

  configure:
    desc: Configure CMake using Conan toolchain and presets
    deps: [setup]
    cmds:
      - cmake --preset conan-release -DBGL_BUILD_TESTING=ON

  build:
    desc: Build all native shared libraries and executables
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} -j$(nproc)

  test:
    desc: Run GTest test suites
    deps: [build]
    cmds:
      - ctest --test-dir {{.BUILD_DIR}} --output-on-failure

  clean:
    desc: Clean build directories
    cmds:
      - rm -rf build build-native build-wasm ConanPresets.json CMakeUserPresets.json
